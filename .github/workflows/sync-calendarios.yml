name: Sync Calendarios Armadores

# ─────────────────────────────────────────────────────────────────────────────
# Extrae eventos de Google Calendar → CSVs en public/data/calendario_armadores/
# SECRETO REQUERIDO en Settings → Secrets → Actions:
#   GOOGLE_TOKEN_JSON  →  contenido completo de token.json (con refresh_token)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 8 veces al día, lunes-sábado, de 6am a 8pm hora RD (UTC-4)
    # UTC: 10, 12, 14, 16, 18, 20, 22, 00
    - cron: "0 10,12,14,16,18,20,22,0 * * 1-6"

  workflow_dispatch:
    inputs:
      days_back:
        description: "Días hacia atrás (default 30)"
        required: false
        default: "30"
      days_ahead:
        description: "Días hacia adelante (default 90)"
        required: false
        default: "90"

jobs:
  sync:
    name: Exportar calendarios → CSV
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/calendarios_armadores/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/calendarios_armadores/requirements.txt

      - name: Escribir token.json
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          echo "$GOOGLE_TOKEN_JSON" > scripts/calendarios_armadores/token.json

      - name: Exportar calendarios
        run: |
          DAYS_BACK="${{ github.event.inputs.days_back || '30' }}"
          DAYS_AHEAD="${{ github.event.inputs.days_ahead || '90' }}"
          cd scripts/calendarios_armadores
          python exportar_calendarios_armadores.py \
            --days-back "$DAYS_BACK" \
            --days-ahead "$DAYS_AHEAD"

      - name: Commit y push CSVs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/calendario_armadores/*.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en los CSVs."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(calendarios): sync automatico $TIMESTAMP"
            git push
            echo "CSVs actualizados."
          fi

      - name: Limpiar token.json
        if: always()
        run: rm -f scripts/calendarios_armadores/token.json
